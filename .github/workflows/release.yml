# ════════════════════════════════════════════════════════════════════════════════
# Release — Stable NuGet Publish
# Triggers when a version tag (v*.*.*) is pushed to main.
# Full validation → pack → publish to NuGet.org → GitHub Release.
#
# Workflow:
#   1. Merge canary → main via PR
#   2. Tag the merge commit: git tag v0.1.0 && git push --tags
#   3. This workflow takes over
# ════════════════════════════════════════════════════════════════════════════════
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"      # v1.0.0
      - "v[0-9]+.[0-9]+.[0-9]+-?*"    # v1.0.0-rc.1

permissions:
  contents: write
  packages: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # 1. Validate — Full build + test + security scan
  # ──────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Security audit
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -qi "has the following vulnerable packages" audit.txt; then
            echo "::error::Cannot release with vulnerable dependencies!"
            exit 1
          fi

      - name: Build
        run: dotnet build --no-restore -c ${{ env.CONFIGURATION }} -warnaserror

      - name: Test
        run: >
          dotnet test --no-build -c ${{ env.CONFIGURATION }}
          --logger "trx;LogFileName=results.trx"
          --results-directory ./TestResults

      - name: Build sample app
        run: dotnet build samples/Aegis.Auth.Sample/Aegis.Auth.Sample.csproj -c ${{ env.CONFIGURATION }}

  # ──────────────────────────────────────────────────────────────────────────────
  # 2. Publish — Pack and push to NuGet.org + GitHub Release
  # ──────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to NuGet
    needs: validate
    runs-on: ubuntu-latest
    # Requires a "nuget" environment in GitHub Settings → Environments.
    # Configure with an approval gate for production releases.
    environment: ${{ vars.NUGET_ENVIRONMENT || 'nuget' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 Release version: ${VERSION}"

          # Detect if this is a pre-release (e.g., v1.0.0-rc.1)
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: dotnet build -c ${{ env.CONFIGURATION }}

      - name: Pack
        run: >
          dotnet pack src/Aegis.Auth/Aegis.Auth.csproj
          --no-build -c ${{ env.CONFIGURATION }}
          -o ./artifacts
          /p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --source "https://api.nuget.org/v3/index.json"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Generate release notes
        id: notes
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 << 'PYTHON'
          import subprocess, json, re, os

          new_version = os.environ["NEW_VERSION"]

          result = subprocess.run(
              ["gh", "release", "list", "--limit", "10", "--json", "tagName,publishedAt"],
              capture_output=True, text=True
          )
          releases = json.loads(result.stdout.strip() or "[]")
          last_tag, last_date = "", "2020-01-01T00:00:00Z"
          for r in releases:
              if "-" not in r["tagName"].lstrip("v"):
                  last_tag = r["tagName"]
                  last_date = r["publishedAt"]
                  break

          result = subprocess.run(
              ["gh", "pr", "list",
               "--state", "merged",
               "--base", "main",
               "--json", "title,number,author,labels",
               "--search", f"merged:>={last_date}",
               "--limit", "200"],
              capture_output=True, text=True
          )
          prs = json.loads(result.stdout.strip() or "[]")

          TYPE_RE = re.compile(
              r"^(feat|fix|chore|docs|refactor|test|ci|perf|build|breaking)(\([^)]*\))?[!]?[: ]+",
              re.IGNORECASE
          )
          BREAKING_RE = re.compile(r"^breaking|BREAKING CHANGE", re.IGNORECASE)
          FEAT_RE = re.compile(r"^feat(ure)?[!:(]|^feat\b", re.IGNORECASE)
          FIX_RE = re.compile(r"^fix[!:(]|^fix\b", re.IGNORECASE)

          def clean(title):
              t = TYPE_RE.sub("", title).strip()
              return t[0].upper() + t[1:] if t else title

          features, fixes, breaking, misc = [], [], [], []
          contributors = set()

          for pr in prs:
              title = pr["title"]
              contributors.add(pr["author"]["login"])
              entry = f"- {clean(title)} (#{pr['number']})"
              has_breaking = any(l["name"] == "breaking-change" for l in pr.get("labels", []))

              if BREAKING_RE.match(title) or has_breaking:
                  breaking.append(entry)
              elif FEAT_RE.match(title):
                  features.append(entry)
              elif FIX_RE.match(title):
                  fixes.append(entry)
              else:
                  misc.append(entry)

          sections = ["**Aegis.Auth**\n"]
          if breaking:
              sections.append("**Breaking Changes**\n" + "\n".join(breaking))
          if features:
              sections.append("**Features**\n" + "\n".join(features))
          if fixes:
              sections.append("**Bug Fixes**\n" + "\n".join(fixes))
          if misc:
              sections.append("**Misc Changes**\n" + "\n".join(misc))
          if contributors:
              contrib = ", ".join(f"@{c}" for c in sorted(contributors))
              sections.append(
                  f"**Contributors**\nThanks to everyone who contributed to this release:\n\n{contrib}"
              )
          range_str = f"{last_tag}...v{new_version}" if last_tag else f"v{new_version}"
          sections.append(f"Full changelog: {range_str}")

          body = "\n\n".join(sections)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("body<<RELEASE_EOF\n")
              f.write(body + "\n")
              f.write("RELEASE_EOF\n")
          PYTHON

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "v${{ steps.version.outputs.version }}"
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: ./artifacts/*.nupkg
          body: ${{ steps.notes.outputs.body }}
